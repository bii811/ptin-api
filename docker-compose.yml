services:
  postgres:
    image: postgres:17-alpine
    container_name: ptin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ptin
      POSTGRES_USER: ptin
      POSTGRES_PASSWORD: ptin
    ports:
      - "5433:5432"
    volumes:
      - ptin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptin -d ptin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ptin-postgres-data:
